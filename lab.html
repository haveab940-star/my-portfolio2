<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лаборатория - Тапсырманы орындау</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans h-screen flex flex-col overflow-hidden">
    <!-- Навигация -->
    <nav class="border-b border-slate-800 px-6 py-3 flex justify-between items-center bg-slate-900">
        <a href="index.html" class="text-slate-400 hover:text-white flex items-center space-x-2 text-sm font-medium transition">
            <span>← Тізімге оралу</span>
        </a>
        <h2 id="task-header-title" class="font-bold text-base text-indigo-400">Тапсырма</h2>
        <button id="run-btn" class="bg-emerald-600 hover:bg-emerald-500 px-5 py-2 rounded-xl font-semibold text-sm transition shadow-lg shadow-emerald-600/20 flex items-center space-x-2">
            <span>▶ Тексеруден өткізу</span>
        </button>
    </nav>

    <!-- Негізгі жұмыс аймағы -->
    <div class="flex-1 grid md:grid-cols-2 overflow-hidden">
        <!-- Сол жақ: Тапсырма шарттары мен нәтиже -->
        <div class="p-6 border-r border-slate-800 overflow-y-auto bg-slate-900/20 flex flex-col justify-between">
            <div>
                <div class="bg-indigo-500/10 border border-indigo-500/20 rounded-xl p-4 mb-6">
                    <span class="text-xs font-bold text-indigo-400 uppercase tracking-wider">Тапсырма Шарты</span>
                    <p id="task-desc-text" class="text-slate-300 text-sm mt-2 leading-relaxed"></p>
                </div>

                <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl mb-6">
                    <span class="text-xs font-bold text-slate-500 uppercase">Мысал:</span>
                    <p id="task-example" class="font-mono text-xs mt-1 text-cyan-400"></p>
                </div>
                
                <!-- Нәтижелер блогы -->
                <div id="result-box" class="hidden p-4 rounded-xl border transition-all duration-300">
                    <h4 id="result-heading" class="font-bold text-base mb-1"></h4>
                    <p id="result-desc" class="text-xs leading-relaxed"></p>
                </div>
            </div>

            <div class="text-xs text-slate-500 pt-4 border-t border-slate-900">
                💡 Автоматты тексеру жүйесі кодыңыздағы <code class="text-slate-400">while</code> операторы мен логиканы тексереді.
            </div>
        </div>

        <!-- Оң жақ: Код редакторы -->
        <div class="flex flex-col bg-slate-900">
            <div class="bg-slate-950 px-4 py-2.5 border-b border-slate-800 text-xs font-mono text-slate-400 flex justify-between items-center">
                <span>solution.py</span>
                <span class="text-[10px] bg-slate-800 px-2 py-0.5 rounded text-slate-300">Python 3.10</span>
            </div>
            <textarea id="code-editor" class="flex-1 bg-slate-900 text-emerald-400 font-mono p-4 resize-none focus:outline-none text-sm leading-relaxed" spellcheck="false"></textarea>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
